<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="refresh" content="2; url=$(link-redirect)">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#041f22" />
<title data-network-name>الخالد نت - تم تسجيل الدخول</title>
<link rel="stylesheet" href="fonts/Almarai.css">
<link rel="stylesheet" href="css/style.min.css">
<style>
  html, body {
    background-color: #041f22 !important;
    color: #FFFFFF !important;
    font-family: 'Almarai', 'Tajawal', sans-serif !important;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  .alogin-card {
    background: rgba(15, 118, 110, 0.22);
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-radius: 24px;
    padding: 30px 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    max-width: 400px;
    width: 90%;
  }
</style>
<script>
  function startClock() {
    $(if popup == 'true')
    try {
      open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
    } catch(e) {}
    $(endif)
    var target = unescape('$(link-redirect-esc)');
    if (!target || target.indexOf('$(') !== -1 || target === 'undefined') {
      target = "$(link-redirect)";
    }
    if (!target || target.indexOf('$(') !== -1) {
      target = "status.html";
    }
    location.href = target;
  }
</script>
</head>
<body onload="startClock()">
  <div class="alogin-card">
    <div style="width: 56px; height: 56px; background: rgba(16, 185, 129, 0.2); border: 2px solid #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px auto;">
      <svg viewBox="0 0 24 24" style="width: 30px; height: 30px; fill: #10b981;">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
      </svg>
    </div>
    <h1 style="font-size: 1.3rem; color: #FFFFFF; margin: 0 0 8px 0;">تم تسجيل دخولك بنجاح</h1>
    <p style="font-size: 0.85rem; color: #cbd5e1; margin: 0 0 16px 0;">
      إذا لم تنتقل تلقائياً، اضغط <a href="$(link-redirect)" style="color: #D4AF37; font-weight: 700; text-decoration: underline;">هنا</a>
    </p>
  </div>
</body>
</html>
